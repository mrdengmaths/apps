<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Distance Concept Demonstration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700;800&display=swap');

        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #020617 0%, #0f172a 100%);
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
        }

        #container {
            width: 100%;
            max-width: 900px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        #canvas-area {
            position: relative;
            width: 600px;
            height: 700px;
            background: #0f172a;
            border-radius: 20px;
            box-shadow: 0 20px 40px -10px rgba(0, 0, 0, 0.7), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
            border: 1px solid #1e293b;
            overflow: hidden;
        }

        svg {
            width: 100%;
            height: 100%;
        }

        /* Smooth Fades */
        .fade-element {
            opacity: 0;
            transition: opacity 0.8s ease-in-out;
            pointer-events: none;
        }
        .fade-element.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* Interactive Elements */
        .dot {
            cursor: grab;
            fill: #3b82f6;
            stroke: #fff;
            stroke-width: 2px;
            transition: fill 0.2s, r 0.2s;
            filter: drop-shadow(0 2px 4px rgba(0, 0, 0, 0.4));
        }
        .dot:hover {
            r: 10;
        }
        .dot:active {
            cursor: grabbing;
            r: 9;
        }

        /* Invisible larger hit area for dragging */
        .dot-hitbox {
            cursor: grab;
            fill: transparent;
        }
        .dot-hitbox:active {
            cursor: grabbing;
        }

        /* SVG Styling */
        .axis-line {
            stroke: #475569;
            stroke-width: 4;
            stroke-linecap: round;
        }
        .distance-line {
            stroke-width: 8;
            stroke-linecap: round;
            transition: stroke 0.3s ease;
            filter: drop-shadow(0 0 4px rgba(255,255,255,0.2));
        }
        .dash-line {
            stroke: #64748b;
            stroke-width: 2;
            stroke-dasharray: 6 6;
        }
        .square-border {
            fill: none;
            stroke: #334155;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-linejoin: round;
        }
        
        #distance-text-group {
            font-family: 'JetBrains Mono', monospace;
            font-size: 3rem;
            font-weight: 800;
            transition: fill 0.3s ease;
        }

        /* Speed Control Range Input Customization */
        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            background: transparent;
        }
        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            height: 16px;
            width: 16px;
            border-radius: 50%;
            background: #3b82f6;
            cursor: pointer;
            margin-top: -6px;
        }
        input[type=range]::-webkit-slider-runnable-track {
            width: 100%;
            height: 4px;
            cursor: pointer;
            background: #475569;
            border-radius: 2px;
        }
    </style>
</head>
<body>

    <div id="container">
        <div class="text-center mb-6">
            <h1 class="text-3xl font-bold mb-2 tracking-tight text-slate-100">Big Red Button Solution</h1>
            <p class="text-sm text-slate-500 mb-4">Press <kbd class="bg-slate-800 border border-slate-700 px-2 py-0.5 rounded text-slate-300 font-mono text-xs">Spacebar</kbd> to advance.</p>
            <div class="inline-flex items-center justify-center bg-slate-900 shadow-inner rounded-full px-4 py-1 border border-slate-800">
                <span id="step-indicator" class="text-xs font-bold text-emerald-500 uppercase tracking-widest">Step 0 / 9</span>
            </div>
        </div>

        <div id="canvas-area">
            <svg id="main-svg" viewBox="0 0 600 700">
                <defs>
                    <filter id="shadow" x="-50%" y="-50%" width="200%" height="200%">
                        <feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.5"/>
                    </filter>
                </defs>

                <g id="trace-layer"></g>

                <!-- Full Square border -->
                <g id="full-square-group" class="fade-element">
                    <path class="square-border" d="M 90 200 L 510 200 L 510 620 L 90 620 Z" />
                </g>

                <!-- Top side of square (Moving down) -->
                <g id="square-top-wrapper" class="fade-element" style="transition: transform 1.2s ease;">
                    <line class="axis-line" x1="90" y1="100" x2="510" y2="100" />
                    <circle id="p1_top" class="dot" cx="90" cy="100" r="8" style="pointer-events: none;" />
                    <circle id="p2_top" class="dot" cx="90" cy="100" r="8" style="pointer-events: none;" />
                </g>

                <!-- Left side of square (Rotating) -->
                <g id="square-left-wrapper" class="fade-element" style="transition: transform 1.2s ease; transform-origin: 90px 200px;">
                    <line class="axis-line" x1="90" y1="200" x2="510" y2="200" />
                    <circle id="p1_left" class="dot" cx="90" cy="200" r="8" style="pointer-events: none;" />
                </g>

                <!-- Crosshairs -->
                <g id="crosshairs-group" class="fade-element" style="pointer-events: none;">
                    <line id="dash-v" class="dash-line" x1="0" y1="0" x2="0" y2="0" />
                    <line id="dash-h" class="dash-line" x1="0" y1="0" x2="0" y2="0" />
                    <circle id="intersection-halo" cx="0" cy="0" r="14" fill="none" stroke-width="2.5" class="fade-element" style="display: none;" />
                    <circle id="intersection-dot" cx="0" cy="0" r="8" filter="url(#shadow)" />
                </g>

                <!-- Main line segment -->
                <g id="main-line-group" class="fade-element">
                    <line class="axis-line" x1="90" y1="100" x2="510" y2="100" />
                </g>

                <!-- Distance Line -->
                <g id="distance-line-group" class="fade-element">
                    <line id="dist-line" class="distance-line" x1="0" y1="100" x2="0" y2="100" />
                </g>
                <text id="distance-text-group" class="fade-element" text-anchor="middle" x="300" y="70">0</text>

                <!-- Square Hitbox for dragging -->
                <rect id="square-hitbox" x="90" y="200" width="420" height="420" fill="transparent" class="fade-element" style="cursor: crosshair; display: none;" />

                <!-- Interactive dots -->
                <g id="dots-group" class="fade-element">
                    <circle id="dot1" class="dot" cx="200" cy="100" r="8" />
                    <circle id="dot1-hit" class="dot-hitbox" cx="200" cy="100" r="25" data-target="dot1" />
                    
                    <circle id="dot2" class="dot" cx="400" cy="100" r="8" />
                    <circle id="dot2-hit" class="dot-hitbox" cx="400" cy="100" r="25" data-target="dot2" />
                </g>
            </svg>

            <div id="speed-control-container" class="fade-element absolute bottom-6 right-6 bg-slate-900/90 backdrop-blur px-4 py-3 rounded-xl border border-slate-800 flex flex-col items-center gap-2">
                <label for="speed-slider" class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Speed</label>
                <input type="range" id="speed-slider" min="1" max="10" step="0.5" value="3" class="w-24">
            </div>
            
        </div>
    </div>

    <script>
        const svg = document.getElementById('main-svg');
        const traceLayer = document.getElementById('trace-layer');
        const stepIndicator = document.getElementById('step-indicator');

        const LINE_START = 90;
        const LINE_END = 510;
        const LINE_LENGTH = 420;
        const SCALED_LENGTH = 60; 
        const SCALE_FACTOR = LINE_LENGTH / SCALED_LENGTH;
        const SQUARE_Y = 200;

        let currentStep = 0;
        let d1x = 200; 
        let d2x = 400; 
        
        let isDragging = false;
        let activeDotId = null;
        let paintMode = false;

        let animationFrameId = null;
        let isDrawingDiagonal = false;
        let isRasterScanning = false;
        let scanD1 = LINE_START;
        let scanD2 = LINE_START;

        const COL_ZERO = '#ffffff'; 
        const COL_GREEN = '#34d399'; 
        const COL_RED = '#f43f5e';  

        const els = {
            dot1: document.getElementById('dot1'),
            dot2: document.getElementById('dot2'),
            dot1Hit: document.getElementById('dot1-hit'),
            dot2Hit: document.getElementById('dot2-hit'),
            distLine: document.getElementById('dist-line'),
            distText: document.getElementById('distance-text-group'),
            p1Top: document.getElementById('p1_top'),
            p2Top: document.getElementById('p2_top'),
            p1Left: document.getElementById('p1_left'),
            dashV: document.getElementById('dash-v'),
            dashH: document.getElementById('dash-h'),
            intersectDot: document.getElementById('intersection-dot'),
            intersectHalo: document.getElementById('intersection-halo'),
            squareHitbox: document.getElementById('square-hitbox')
        };

        function updateLogic() {
            let logicalX1 = (d1x - LINE_START) / SCALE_FACTOR;
            let logicalX2 = (d2x - LINE_START) / SCALE_FACTOR;
            let distance = Math.abs(logicalX1 - logicalX2);
            let roundedDistance = Math.round(distance);
            
            let currentColor = COL_RED;
            if (roundedDistance === 0) currentColor = COL_ZERO; 
            else if (roundedDistance <= 10) currentColor = COL_GREEN;

            els.dot1.setAttribute('cx', d1x);
            els.dot1Hit.setAttribute('cx', d1x);
            els.dot2.setAttribute('cx', d2x);
            els.dot2Hit.setAttribute('cx', d2x);

            if (currentStep >= 3) {
                els.distLine.setAttribute('x1', Math.min(d1x, d2x));
                els.distLine.setAttribute('x2', Math.max(d1x, d2x));
                els.distLine.style.stroke = currentColor;
                
                els.distText.setAttribute('x', (d1x + d2x) / 2);
                els.distText.setAttribute('y', 80); 
                els.distText.textContent = roundedDistance.toString();
                els.distText.style.fill = currentColor;
            }

            if (currentStep >= 4) {
                els.p1Top.setAttribute('cx', d1x);
                els.p2Top.setAttribute('cx', d2x);
            }
            if (currentStep >= 5) {
                els.p1Left.setAttribute('cx', d1x); 
            }

            if (currentStep >= 6) {
                let intersectX = d2x;
                let intersectY = SQUARE_Y + (d1x - LINE_START);

                els.dashV.setAttribute('x1', intersectX);
                els.dashV.setAttribute('y1', SQUARE_Y);
                els.dashV.setAttribute('x2', intersectX);
                els.dashV.setAttribute('y2', intersectY);

                els.dashH.setAttribute('x1', LINE_START);
                els.dashH.setAttribute('y1', intersectY);
                els.dashH.setAttribute('x2', intersectX);
                els.dashH.setAttribute('y2', intersectY);

                els.intersectDot.setAttribute('cx', intersectX);
                els.intersectDot.setAttribute('cy', intersectY);
                els.intersectDot.style.fill = currentColor;

                if (currentStep >= 7) {
                    els.intersectHalo.setAttribute('cx', intersectX);
                    els.intersectHalo.setAttribute('cy', intersectY);
                    els.intersectHalo.style.stroke = currentColor;
                }

                if (paintMode && !isDrawingDiagonal && !isRasterScanning && isDragging) {
                    leaveTrace(intersectX, intersectY, currentColor, true);
                }
            }
        }

        function getMousePos(evt) {
            const CTM = svg.getScreenCTM();
            let clientX = evt.touches ? evt.touches[0].clientX : evt.clientX;
            let clientY = evt.touches ? evt.touches[0].clientY : evt.clientY;
            return { x: (clientX - CTM.e) / CTM.a, y: (clientY - CTM.f) / CTM.d };
        }

        function startDrag(evt) {
            if (isDrawingDiagonal || isRasterScanning) return; 
            if (evt.target.classList.contains('dot-hitbox')) {
                isDragging = true;
                activeDotId = evt.target.getAttribute('data-target');
            } else if (evt.target.id === 'square-hitbox') {
                isDragging = true;
                activeDotId = 'square';
                drag(evt); 
            }
        }

        function drag(evt) {
            if (isDragging && activeDotId) {
                evt.preventDefault();
                let coord = getMousePos(evt);
                
                if (activeDotId === 'square') {
                    let boundedX = Math.max(LINE_START, Math.min(LINE_END, coord.x));
                    let boundedY = Math.max(SQUARE_Y, Math.min(SQUARE_Y + LINE_LENGTH, coord.y));
                    d2x = boundedX;
                    d1x = LINE_START + (boundedY - SQUARE_Y);
                } else {
                    let newX = Math.max(LINE_START, Math.min(LINE_END, coord.x));
                    if (activeDotId === 'dot1') d1x = newX;
                    else d2x = newX;
                }
                
                updateLogic();
            }
        }

        function endDrag() {
            isDragging = false;
            activeDotId = null;
        }

        svg.addEventListener('mousedown', startDrag);
        svg.addEventListener('mousemove', drag);
        window.addEventListener('mouseup', endDrag);
        svg.addEventListener('touchstart', startDrag, {passive: false});
        svg.addEventListener('touchmove', drag, {passive: false});
        window.addEventListener('touchend', endDrag);

        function show(id) { const el = document.getElementById(id); if(el) { el.classList.add('visible'); el.style.display = ''; } }

        function leaveTrace(x, y, color, isDense = false) {
            let numDots = isDense ? 4 : 1;
            for(let i=0; i<numDots; i++) {
                const circle = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                let scatterX = (Math.random()-0.5)*15;
                let scatterY = (Math.random()-0.5)*15;
                circle.setAttribute("cx", x + scatterX);
                circle.setAttribute("cy", y + scatterY);
                circle.setAttribute("r", (Math.random() * 2 + 1).toString());
                circle.setAttribute("fill", color);
                circle.setAttribute("opacity", "0.6");
                circle.setAttribute("class", "trace-dot");
                traceLayer.appendChild(circle);
            }
        }

        function getSpeed() { return parseFloat(document.getElementById('speed-slider').value); }

        function animateDiagonal() {
            if (!isDrawingDiagonal) return;
            d1x += 1.5; 
            d2x += 1.5;
            if (d1x >= LINE_END) {
                d1x = LINE_END;
                d2x = LINE_END;
                isDrawingDiagonal = false;
            } else {
                animationFrameId = requestAnimationFrame(animateDiagonal);
            }
            updateLogic();
            let intersectX = d2x;
            let intersectY = SQUARE_Y + (d1x - LINE_START);
            leaveTrace(intersectX, intersectY, COL_ZERO, true);
        }

        function animateRasterScan() {
            if (!isRasterScanning) return;
            let speed = getSpeed() * 15; 
            for(let i=0; i<speed; i++) {
                scanD2 += 1.5;
                if (scanD2 > LINE_END) {
                    scanD2 = LINE_START;
                    scanD1 += 3; 
                }
                if (scanD1 > LINE_END) { isRasterScanning = false; break; }
                
                let dist = Math.abs((scanD1 - LINE_START) - (scanD2 - LINE_START)) / SCALE_FACTOR;
                let roundedDist = Math.round(dist);
                let col = roundedDist === 0 ? COL_ZERO : (roundedDist <= 10 ? COL_GREEN : COL_RED);
                
                let cx = scanD2;
                let cy = SQUARE_Y + (scanD1 - LINE_START);
                leaveTrace(cx, cy, col, false); 
            }
            d1x = scanD1; d2x = scanD2;
            updateLogic();
            if (isRasterScanning) animationFrameId = requestAnimationFrame(animateRasterScan);
        }

        async function advanceStep() {
            if (currentStep >= 9) return;
            currentStep++;
            stepIndicator.textContent = `Step ${currentStep} / 9`;

            switch (currentStep) {
                case 1: show('main-line-group'); break;
                case 2: show('dots-group'); break;
                case 3: show('distance-line-group'); show('distance-text-group'); break;
                case 4: 
                    show('square-top-wrapper');
                    setTimeout(() => {
                        document.getElementById('square-top-wrapper').style.transform = 'translateY(100px)';
                    }, 50);
                    break;
                case 5:
                    show('square-left-wrapper');
                    els.p1Top.style.display = 'none';
                    setTimeout(() => {
                        document.getElementById('square-left-wrapper').style.transform = 'rotate(90deg)';
                    }, 50);
                    break;
                case 6:
                    show('full-square-group');
                    show('crosshairs-group');
                    els.squareHitbox.style.display = 'block';
                    setTimeout(() => els.squareHitbox.classList.add('visible'), 50);
                    updateLogic();
                    break;
                case 7: 
                    paintMode = true; 
                    
                    els.intersectHalo.style.display = 'block';
                    setTimeout(() => els.intersectHalo.classList.add('visible'), 50);
                    els.intersectDot.setAttribute('r', '5'); // Target visual look
                    
                    // Leave an initial splash of paint so the user sees the mode changed
                    let lx1 = (d1x - LINE_START) / SCALE_FACTOR;
                    let lx2 = (d2x - LINE_START) / SCALE_FACTOR;
                    let rndDist = Math.round(Math.abs(lx1 - lx2));
                    let initCol = rndDist === 0 ? COL_ZERO : (rndDist <= 10 ? COL_GREEN : COL_RED);
                    
                    for (let p = 0; p < 5; p++) {
                        leaveTrace(d2x, SQUARE_Y + (d1x - LINE_START), initCol, true);
                    }
                    break;
                case 8:
                    paintMode = true;
                    isDrawingDiagonal = true;
                    d1x = LINE_START;
                    d2x = LINE_START;
                    updateLogic();
                    animateDiagonal();
                    break;
                case 9:
                    show('speed-control-container');
                    paintMode = true;
                    isDrawingDiagonal = false;
                    isRasterScanning = true;
                    scanD1 = LINE_START;
                    scanD2 = LINE_START;
                    d1x = scanD1;
                    d2x = scanD2;
                    animateRasterScan();
                    break;
            }
            updateLogic();
        }

        document.addEventListener('keydown', (e) => { if (e.code === 'Space') { e.preventDefault(); advanceStep(); } });
        updateLogic();

    </script>
</body>
</html>
