<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Right Prisms Unfolding</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background-color: #111; color: white; font-family: 'Inter', sans-serif; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 1; }
        #matrix-canvas { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; z-index: 0; opacity: 0; transition: opacity 0.5s ease; pointer-events: none; }
        
        .panel { position: absolute; z-index: 10; background: rgba(30, 30, 35, 0.85); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 12px; padding: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
        .top-left { top: 16px; left: 16px; width: 320px; }
        .bottom-center { bottom: 24px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 600px; display: flex; flex-direction: column; gap: 12px; }
        .right-slider { top: 50%; right: 24px; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 12px; padding: 20px 12px; }

        input[type=range] { -webkit-appearance: none; width: 100%; background: transparent; }
        input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; height: 20px; width: 20px; border-radius: 50%; background: #3b82f6; cursor: pointer; margin-top: -8px; box-shadow: 0 0 10px rgba(59, 130, 246, 0.5); }
        input[type=range]::-webkit-slider-runnable-track { width: 100%; height: 4px; cursor: pointer; background: rgba(255,255,255,0.2); border-radius: 2px; }
        
        input[type=range].vertical { writing-mode: bt-lr; -webkit-appearance: slider-vertical; width: 8px; height: 150px; }

        .btn { padding: 8px 16px; background: rgba(59, 130, 246, 0.2); border: 1px solid #3b82f6; border-radius: 6px; color: white; cursor: pointer; transition: all 0.2s; font-size: 14px; }
        .btn:hover { background: rgba(59, 130, 246, 0.5); box-shadow: 0 0 15px rgba(59, 130, 246, 0.4); }
        .btn.active { background: #3b82f6; font-weight: bold; }
    </style>
    
    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>
</head>
<body>

    <canvas id="matrix-canvas"></canvas>
    <div id="canvas-container"></div>

    <div class="panel top-left">
        <h2 class="text-xl font-bold mb-2">3D Geometry Unfolding</h2>
        <p class="text-sm text-gray-300 mb-3">Explore how right prisms and pyramids unfold into flat nets. Click faces or edges to highlight them!</p>
        
        <div class="flex flex-col gap-3">
            <div>
                <label class="text-sm text-gray-400 block mb-1">Shape:</label>
                <select id="shape-select" class="w-full bg-gray-800 text-white rounded p-2 border border-gray-600 focus:outline-none focus:border-blue-500">
                    <option value="rectangular">Rectangular Prism</option>
                    <option value="triangular-regular">Reg. Triangular Prism</option>
                    <option value="triangular-irregular">Irreg. Triangular Prism (Scalene)</option>
                    <option value="hexagonal">Hexagonal Prism</option>
                    <option value="cylinder">Cylinder</option>
                    <option value="l-shape">L-Shape Prism</option>
                </select>
            </div>
            <div>
                <label class="text-sm text-gray-400 block mb-1">Theme:</label>
                <select id="theme-select" class="w-full bg-gray-800 text-white rounded p-2 border border-gray-600 focus:outline-none focus:border-blue-500">
                    <option value="default">Default</option>
                    <option value="sunset">Sunset</option>
                    <option value="neon">Neon (Pulsating Glow)</option>
                    <option value="matrix">Matrix (Code Rain)</option>
                    <option value="cyberpunk">Cyberpunk (Glossy)</option>
                </select>
            </div>
            <button id="btn-reset-view" class="btn mt-2">Reset Perspective</button>
            <button id="toggle-perimeter" class="btn">Toggle Edge Highlights</button>
            <button id="toggle-cross-section" class="btn border-green-500 text-green-400 hover:bg-green-500 hover:text-white">Show Cross-Section</button>
        </div>
    </div>

    <div class="panel right-slider">
        <label class="text-xs text-gray-400 font-bold uppercase tracking-wider">Height</label>
        <input type="range" id="height-slider" class="vertical" min="0" max="8" step="0.1" value="4">
        <button id="btn-anim-height" class="btn px-2 py-1 text-xs mt-2 mb-2">Anim</button>
        
        <div id="cs-controls" style="display: none; flex-direction: column; align-items: center; gap: 12px; width: 100%; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px;">
            <label class="text-xs text-green-400 font-bold uppercase tracking-wider text-center">C-Sec<br>Drag</label>
            <input type="range" id="cs-slider" class="vertical" min="0" max="1" step="0.01" value="0.5">
            <button id="btn-anim-cs" class="btn px-2 py-1 text-xs mt-2 mb-2">Anim</button>
        </div>
    </div>

    <div class="panel bottom-center">
        <div class="flex justify-between items-center w-full px-2">
            <button id="btn-fold" class="btn text-xs px-3">Fold (3D)</button>
            <span class="text-sm font-semibold text-gray-300">Unfold Progress</span>
            <button id="btn-unfold" class="btn text-xs px-3">Unfold (2D)</button>
        </div>
        <div class="flex items-center gap-4">
            <span class="text-xs text-blue-400 font-bold">3D</span>
            <input type="range" id="unfold-slider" min="0" max="1" step="0.01" value="0">
            <span class="text-xs text-green-400 font-bold">2D</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
        import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
        import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

        // 1. Core State Variables
        let scene, camera, renderer, composer, bloomPass;
        let prismGroup, shapeContainer;
        let faces = [];
        let thickEdgesGroups = [];
        let clickableMeshes = [];
        
        let currentHeight = 4;
        let currentUnfoldProgress = 0;
        let highlightPerimeter = false;
        
        // Feature State
        let previousShapeType = '';
        let showCrossSection = false;
        let crossSectionRelativeHeight = 0.5;
        let crossSectionHinge = null;
        let csMeshGlobal = null;
        let isDraggingCS = false;
        let startMouseY = 0;
        let startCSHeight = 0;

        // Interaction State
        let isDragging = false;
        let previousMousePosition = { x: 0, y: 0 };
        let targetRotationX = 0.5;
        let targetRotationY = 0.5;
        let currentRotationX = 0.5;
        let currentRotationY = 0.5;
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let startClickPos = { x: 0, y: 0 };
        let startClickTime = 0;

        // Animation State
        let unfoldAnimActive = false;
        let unfoldAnimTarget = 0;
        let heightAnimActive = false;
        let heightAnimDir = 1;
        let csAnimActive = false;
        let csAnimDir = 1;
        let isResettingView = false;

        // 2. Theme Configuration
        const themes = {
            default: { bg: 0x111111, base: 0x3b82f6, lat: 0xe5e7eb, edge: 0x1f2937, highlight: 0xf59e0b, glow: false },
            sunset: { bg: 0x2d1b2e, base: 0xf97316, lat: 0xf43f5e, edge: 0x7c2d12, highlight: 0xfde047, glow: false },
            neon: { bg: 0x050510, base: 0xd946ef, lat: 0x06b6d4, edge: 0xffffff, highlight: 0xfde047, glow: true },
            matrix: { bg: 0x000000, base: 0x022c02, lat: 0x001100, edge: 0x00ff00, highlight: 0xffffff, glow: true },
            cyberpunk: { bg: 0x0a0a0a, base: 0xeab308, lat: 0xa855f7, edge: 0x22d3ee, highlight: 0xf43f5e, glow: true }
        };
        let currentTheme = 'default';

        // 3. Matrix Background Effect
        const mCanvas = document.getElementById('matrix-canvas');
        const mCtx = mCanvas.getContext('2d');
        let mLetters = [];
        let mCols = 0;
        let matrixTexture; // Add texture variable
        
        function setupMatrix() {
            mCanvas.width = window.innerWidth;
            mCanvas.height = window.innerHeight;
            const fontSize = 16;
            mCols = Math.floor(mCanvas.width / fontSize);
            mLetters = [];
            for (let i = 0; i < mCols; i++) {
                // Fix initial y-position math
                mLetters[i] = Math.random() * (mCanvas.height / fontSize);
            }
            // Re-create the texture cleanly on resize
            if (matrixTexture) matrixTexture.dispose();
            matrixTexture = new THREE.CanvasTexture(mCanvas);
            if (typeof scene !== 'undefined' && currentTheme === 'matrix') {
                scene.background = matrixTexture;
            }
        }

        function drawMatrix() {
            if (currentTheme !== 'matrix') return;
            mCtx.fillStyle = 'rgba(0, 0, 0, 0.1)';
            mCtx.fillRect(0, 0, mCanvas.width, mCanvas.height);
            mCtx.fillStyle = '#0a0';
            mCtx.font = '16px monospace';
            
            for (let i = 0; i < mLetters.length; i++) {
                const text = String.fromCharCode(0x30A0 + Math.random() * 96);
                mCtx.fillText(text, i * 16, mLetters[i] * 16);
                if (mLetters[i] * 16 > mCanvas.height && Math.random() > 0.95) {
                    mLetters[i] = 0;
                }
                mLetters[i]++;
            }
            // Tell Three.js the canvas texture has updated frame data
            if (matrixTexture) matrixTexture.needsUpdate = true;
        }

        function initThreeJS() {
            const container = document.getElementById('canvas-container');
            
            scene = new THREE.Scene();
            scene.background = new THREE.Color(themes[currentTheme].bg);

            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
            camera.position.set(0, 5, 12);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            renderer.setPixelRatio(window.devicePixelRatio);
            container.appendChild(renderer.domElement);

            // Lighting
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
            dirLight.position.set(10, 20, 10);
            scene.add(dirLight);
            const dirLight2 = new THREE.DirectionalLight(0xffffff, 0.4);
            dirLight2.position.set(-10, -10, -10);
            scene.add(dirLight2);

            // Groups
            prismGroup = new THREE.Group();
            scene.add(prismGroup);
            shapeContainer = new THREE.Group();
            prismGroup.add(shapeContainer);

            // Post-Processing for Glow
            composer = new EffectComposer(renderer);
            const renderScene = new RenderPass(scene, camera);
            composer.addPass(renderScene);

            bloomPass = new UnrealBloomPass(new THREE.Vector2(window.innerWidth, window.innerHeight), 1.0, 0.4, 0.1);
            composer.addPass(bloomPass);
            bloomPass.strength = 0; // Disabled by default

            window.addEventListener('resize', onWindowResize, false);
            setupMatrix();
            setupInteraction();
            generateShape('rectangular');
            animate();
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
            composer.setSize(window.innerWidth, window.innerHeight);
            setupMatrix();
        }

        function getPolygonPoints(type) {
            const points = [];
            switch (type) {
                case 'rectangular':
                    points.push(new THREE.Vector2(-2, -1.5), new THREE.Vector2(2, -1.5), new THREE.Vector2(2, 1.5), new THREE.Vector2(-2, 1.5));
                    break;
                case 'triangular-regular':
                    points.push(new THREE.Vector2(0, 2), new THREE.Vector2(-1.732, -1), new THREE.Vector2(1.732, -1));
                    break;
                case 'triangular-irregular':
                    // Scalene triangle: clearly distinct lengths and angles
                    points.push(new THREE.Vector2(-2, -1), new THREE.Vector2(2.5, -1.5), new THREE.Vector2(0, 3));
                    break;
                case 'hexagonal':
                    for (let i = 0; i < 6; i++) {
                        points.push(new THREE.Vector2(2*Math.cos(i*Math.PI/3), 2*Math.sin(i*Math.PI/3)));
                    }
                    break;
                case 'cylinder':
                    for (let i = 0; i < 32; i++) {
                        points.push(new THREE.Vector2(2*Math.cos(i*Math.PI/16), 2*Math.sin(i*Math.PI/16)));
                    }
                    break;
                case 'l-shape':
                    points.push(new THREE.Vector2(-1.5, -1.5), new THREE.Vector2(1.5, -1.5), new THREE.Vector2(1.5, -0.5), new THREE.Vector2(-0.5, -0.5), new THREE.Vector2(-0.5, 1.5), new THREE.Vector2(-1.5, 1.5));
                    break;
            }
            return points;
        }

        function disposeGroup(group) {
            while (group.children.length > 0) {
                const child = group.children[0];
                if (child.isGroup) disposeGroup(child);
                if (child.geometry) child.geometry.dispose();
                if (child.material) {
                    if (Array.isArray(child.material)) child.material.forEach(m => m.dispose());
                    else child.material.dispose();
                }
                group.remove(child);
            }
        }

        function generateShape(type) {
            let savedHighlights = [];
            // Preserve highlights state if we are just modifying the height
            if (previousShapeType === type) {
                savedHighlights = clickableMeshes.map(m => m.userData.isHighlighted);
            }
            previousShapeType = type;

            disposeGroup(shapeContainer);
            faces = [];
            thickEdgesGroups = [];
            clickableMeshes = [];
            
            shapeContainer.rotation.set(0, 0, 0);
            shapeContainer.position.set(0, 0, 0);
            
            generatePrism(type);

            updateFoldState(currentUnfoldProgress);
            updatePerimeterHighlight();

            // Re-apply preserved highlights securely
            if (savedHighlights.length === clickableMeshes.length) {
                for (let i = 0; i < clickableMeshes.length; i++) {
                    setHighlightState(clickableMeshes[i], savedHighlights[i]);
                }
            }
        }

        function createMaterials(t, type) {
            const baseMatOpts = { color: t.base, side: THREE.DoubleSide, transparent: true, opacity: t.glow ? 0.7 : (currentTheme==='cyberpunk'?0.9:0.95) };
            const latMatOpts = { color: t.lat, side: THREE.DoubleSide, transparent: true, opacity: t.glow ? 0.7 : (currentTheme==='cyberpunk'?0.9:0.85) };
            
            let baseMat, latMat;
            if (currentTheme === 'cyberpunk') {
                baseMat = new THREE.MeshStandardMaterial({ ...baseMatOpts, metalness: 0.9, roughness: 0.1 });
                latMat = new THREE.MeshStandardMaterial({ ...latMatOpts, metalness: 0.9, roughness: 0.1 });
            } else {
                baseMatOpts.emissive = t.glow ? t.base : 0x000000;
                baseMatOpts.emissiveIntensity = currentTheme === 'neon' ? 0.2 : (t.glow ? 0.3 : 0);
                latMatOpts.emissive = t.glow ? t.lat : 0x000000;
                latMatOpts.emissiveIntensity = currentTheme === 'neon' ? 0.1 : (t.glow ? 0.1 : 0);
                baseMat = new THREE.MeshLambertMaterial(baseMatOpts);
                latMat = new THREE.MeshLambertMaterial(latMatOpts);
            }

            const edgeMat = new THREE.LineBasicMaterial({ 
                color: t.edge, linewidth: t.glow ? 3 : 2, transparent: t.glow, opacity: t.glow ? 0.8 : 1.0
            });

            return { baseMat, latMat, edgeMat };
        }

        function addPickableEdges(geom, parentMesh, groupId, edgeMat, isPickable = true, onlyRightEdge = false, rectLength = 0) {
            const edgesGeom = new THREE.EdgesGeometry(geom);
            const lineMesh = new THREE.LineSegments(edgesGeom, edgeMat);
            parentMesh.add(lineMesh); // Visual thin line

            if (!isPickable) return;

            const pos = edgesGeom.attributes.position;
            for(let i=0; i<pos.count; i+=2) {
                const p1 = new THREE.Vector3(pos.getX(i), pos.getY(i), pos.getZ(i));
                const p2 = new THREE.Vector3(pos.getX(i+1), pos.getY(i+1), pos.getZ(i+1));
                
                if (onlyRightEdge) {
                    if (Math.abs(p1.x - p2.x) > 0.001 || Math.abs(p1.x - rectLength) > 0.001) continue;
                }

                const dist = p1.distanceTo(p2);
                if(dist < 0.001) continue;

                // Hitbox for clicking
                const hitCyl = new THREE.CylinderGeometry(0.2, 0.2, dist, 4);
                const hitMat = new THREE.MeshBasicMaterial({visible: false});
                const hitMesh = new THREE.Mesh(hitCyl, hitMat);
                
                // Visible highlight when clicked
                const hlCyl = new THREE.CylinderGeometry(0.12, 0.12, dist, 8);
                const hlMat = new THREE.MeshBasicMaterial({color: themes[currentTheme].highlight});
                const hlMesh = new THREE.Mesh(hlCyl, hlMat);
                hlMesh.visible = false;

                const mid = p1.clone().add(p2).multiplyScalar(0.5);
                const dir = p2.clone().sub(p1).normalize();
                const quat = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0,1,0), dir);
                
                hitMesh.position.copy(mid);
                hitMesh.quaternion.copy(quat);
                hlMesh.position.copy(mid);
                hlMesh.quaternion.copy(quat);

                hitMesh.userData = { type: 'edge', isHighlighted: false, highlightMesh: hlMesh, groupId: groupId };
                parentMesh.add(hitMesh);
                parentMesh.add(hlMesh);
                clickableMeshes.push(hitMesh);
            }
        }

        function generatePrism(type) {
            const points = getPolygonPoints(type);
            const numSides = points.length;
            const t = themes[currentTheme];
            const mats = createMaterials(t, type);

            const highlightThickMat = new THREE.MeshBasicMaterial({ color: t.highlight });
            const thickLineRadius = 0.08;
            const baseShape = new THREE.Shape(points);

            const sides = [];
            let totalWidth = 0;
            for (let i = 0; i < numSides; i++) {
                const p1 = points[i];
                const p2 = points[(i + 1) % numSides];
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const length = Math.sqrt(dx*dx + dy*dy);
                const angle = Math.atan2(dy, dx);
                sides.push({ length, angle, p1, p2 });
                totalWidth += length;
            }

            // Find a valid convex edge to attach the bases so they unfold outwards cleanly
            let validHinges = [];
            for (let i = 0; i < numSides; i++) {
                const p1 = sides[i].p1;
                const p2 = sides[i].p2;
                let isConvex = true;
                for (let j = 0; j < numSides; j++) {
                    const p3 = points[j];
                    const cross = (p2.x - p1.x) * (p3.y - p1.y) - (p2.y - p1.y) * (p3.x - p1.x);
                    // Standard cross product check for convexity regarding inner area
                    if (cross < -0.01) { isConvex = false; break; }
                }
                if (isConvex) validHinges.push(i);
            }

            const idealMid = Math.floor(numSides / 2);
            let bestHingeIndex = idealMid;
            if (validHinges.length > 0) {
                let minDiff = 999;
                validHinges.forEach(idx => {
                    if (Math.abs(idx - idealMid) < minDiff) {
                        minDiff = Math.abs(idx - idealMid);
                        bestHingeIndex = idx;
                    }
                });
            }

            const mainPivot = new THREE.Group();
            shapeContainer.add(mainPivot);
            let currentPivot = mainPivot;
            
            for (let i = 0; i < numSides; i++) {
                const side = sides[i];
                const safeHeight = Math.max(0.001, currentHeight);
                const rectGeom = new THREE.PlaneGeometry(side.length, safeHeight);
                rectGeom.translate(side.length / 2, 0, 0); 
                
                const rectMesh = new THREE.Mesh(rectGeom, mats.latMat.clone());
                rectMesh.userData = { type: 'face', isHighlighted: false, groupId: type === 'cylinder' ? 'cyl-lat' : null };
                clickableMeshes.push(rectMesh);
                
                if (type !== 'cylinder') {
                    addPickableEdges(rectGeom, rectMesh, null, mats.edgeMat.clone());
                } else {
                    if (i === numSides - 1) {
                        addPickableEdges(rectGeom, rectMesh, 'cyl-lat-edge', mats.edgeMat.clone(), true, true, side.length);
                    } else {
                        addPickableEdges(rectGeom, rectMesh, 'cyl-lat-edge', mats.edgeMat.clone(), false);
                    }
                }

                // Thick perimeter highlight lines (Top and Bottom of rectangles only)
                const latThickEdges = new THREE.Group();
                if (currentHeight > 0.001) {
                    const createEdgeMesh = (yOffset) => {
                        const cyl = new THREE.CylinderGeometry(thickLineRadius, thickLineRadius, side.length, 8);
                        const mesh = new THREE.Mesh(cyl, highlightThickMat);
                        mesh.position.set(side.length/2, yOffset, 0);
                        mesh.rotation.z = Math.PI / 2;
                        
                        if (t.glow) {
                            const coreCyl = new THREE.CylinderGeometry(thickLineRadius * 1.2, thickLineRadius * 1.2, side.length, 8);
                            const coreMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
                            mesh.add(new THREE.Mesh(coreCyl, coreMat));
                            
                            const auraCyl = new THREE.CylinderGeometry(thickLineRadius * 4, thickLineRadius * 4, side.length, 8);
                            const auraMat = new THREE.MeshBasicMaterial({ color: t.highlight, transparent: true, opacity: 0.4, blending: THREE.AdditiveBlending, depthWrite: false });
                            mesh.add(new THREE.Mesh(auraCyl, auraMat));
                        }
                        return mesh;
                    };
                    latThickEdges.add(createEdgeMesh(currentHeight/2));
                    latThickEdges.add(createEdgeMesh(-currentHeight/2));
                }
                latThickEdges.visible = highlightPerimeter;
                thickEdgesGroups.push(latThickEdges);
                rectMesh.add(latThickEdges); // Attach directly to rectangle face

                const faceContainer = new THREE.Group();
                faceContainer.add(rectMesh);
                
                // Calculate folding angle for sequential chaining
                let foldAngle = 0;
                if (i > 0) {
                    foldAngle = side.angle - sides[i-1].angle;
                    while (foldAngle <= -Math.PI) foldAngle += Math.PI * 2;
                    while (foldAngle > Math.PI) foldAngle -= Math.PI * 2;
                }

                currentPivot.add(faceContainer);
                faces.push({ mesh: faceContainer, type: 'lateral', targetFoldAngle: i === 0 ? 0 : foldAngle, targetUnfoldAngle: 0 });

                if (i < numSides - 1) {
                    const nextPivot = new THREE.Group();
                    nextPivot.position.set(side.length, 0, 0); 
                    faceContainer.add(nextPivot);
                    currentPivot = nextPivot;
                }

                // Attach Bases to the best convex middle face to avoid overlapping
                if (i === bestHingeIndex) {
                    const cleanBaseGeom = new THREE.ShapeGeometry(baseShape);
                    // Translate and rotate so the attaching edge is aligned on the X axis locally
                    cleanBaseGeom.translate(-side.p1.x, -side.p1.y, 0);
                    cleanBaseGeom.rotateZ(-side.angle);

                    // Bottom Base (rotateX PI to face downwards)
                    const bottomBaseGeom = cleanBaseGeom.clone();
                    bottomBaseGeom.rotateX(Math.PI);
                    const bottomBase = new THREE.Mesh(bottomBaseGeom, mats.baseMat.clone());
                    bottomBase.userData = { type: 'face', isHighlighted: false, groupId: type === 'cylinder' ? 'cyl-base-bot' : null };
                    clickableMeshes.push(bottomBase);
                    addPickableEdges(bottomBaseGeom, bottomBase, type === 'cylinder' ? 'cyl-base-bot-edge' : null, mats.edgeMat.clone());

                    const bottomHinge = new THREE.Group();
                    bottomHinge.position.set(0, -currentHeight/2, 0);
                    bottomHinge.add(bottomBase);
                    faceContainer.add(bottomHinge);
                    faces.push({ mesh: bottomHinge, type: 'base', targetFoldAngle: Math.PI / 2, targetUnfoldAngle: 0 });

                    // Top Base (no mirror/rotate needed, just standard attach)
                    const topBaseGeom = cleanBaseGeom.clone();
                    const topBase = new THREE.Mesh(topBaseGeom, mats.baseMat.clone());
                    topBase.userData = { type: 'face', isHighlighted: false, groupId: type === 'cylinder' ? 'cyl-base-top' : null };
                    clickableMeshes.push(topBase);
                    addPickableEdges(topBaseGeom, topBase, type === 'cylinder' ? 'cyl-base-top-edge' : null, mats.edgeMat.clone());

                    const topHinge = new THREE.Group();
                    topHinge.position.set(0, currentHeight/2, 0);
                    topHinge.add(topBase);
                    faceContainer.add(topHinge);
                    faces.push({ mesh: topHinge, type: 'base', targetFoldAngle: -Math.PI / 2, targetUnfoldAngle: 0 });

                    // --- Cross Section Plane ---
                    const csBaseGeom = cleanBaseGeom.clone();
                    const csMat = new THREE.MeshBasicMaterial({ color: 0x10b981, transparent: true, opacity: 0.6, side: THREE.DoubleSide });
                    csMeshGlobal = new THREE.Mesh(csBaseGeom, csMat);
                    csMeshGlobal.userData = { type: 'cross-section' };
                    
                    const csEdges = new THREE.EdgesGeometry(csBaseGeom);
                    const csLine = new THREE.LineSegments(csEdges, new THREE.LineBasicMaterial({ color: 0x34d399, linewidth: 2 }));
                    csMeshGlobal.add(csLine);

                    crossSectionHinge = new THREE.Group();
                    crossSectionHinge.position.set(0, (crossSectionRelativeHeight - 0.5) * currentHeight, 0);
                    crossSectionHinge.add(csMeshGlobal);
                    crossSectionHinge.visible = showCrossSection;
                    faceContainer.add(crossSectionHinge);
                    faces.push({ mesh: crossSectionHinge, type: 'cross-section', targetFoldAngle: -Math.PI / 2, targetUnfoldAngle: 0 });
                }
            }

            // Center the entire structure
            shapeContainer.position.set(-totalWidth / 4, 0, 0);
        }

        function setHighlightState(obj, state) {
            if (obj.userData.isHighlighted === state) return;
            obj.userData.isHighlighted = state;
            
            if (obj.userData.type === 'face') {
                if (state) {
                    let intensity = 0.8;
                    if (currentTheme === 'neon' || currentTheme === 'matrix') intensity = 0.35;
                    obj.material.emissive.setHex(themes[currentTheme].highlight);
                    obj.material.emissiveIntensity = intensity;
                } else {
                    obj.material.emissive.setHex(themes[currentTheme].glow ? themes[currentTheme].lat : 0x000000);
                    obj.material.emissiveIntensity = themes[currentTheme].glow ? (currentTheme === 'neon' ? 0.2 : 0.1) : 0;
                }
                
                obj.children.forEach(c => {
                    if (c.isLineSegments) {
                        if (!c.userData.originalMat) c.userData.originalMat = c.material;
                        if (state) {
                            let thickness = 4;
                            if (currentTheme === 'neon' || currentTheme === 'matrix') thickness = 2;
                            c.material = c.userData.originalMat.clone();
                            c.material.color.setHex(0xffffff);
                            c.material.linewidth = thickness;
                        } else {
                            c.material = c.userData.originalMat;
                        }
                    }
                });
            } else if (obj.userData.type === 'edge') {
                obj.userData.highlightMesh.visible = state;
                if (state && (currentTheme === 'neon' || currentTheme === 'matrix')) {
                     obj.userData.highlightMesh.material.opacity = 0.5;
                     obj.userData.highlightMesh.material.transparent = true;
                }
            }
        }

        function toggleHighlight(obj) {
            const newState = !obj.userData.isHighlighted;
            let objectsToToggle = [obj];
            if (obj.userData.groupId) {
                objectsToToggle = clickableMeshes.filter(m => m.userData.groupId === obj.userData.groupId);
            }
            objectsToToggle.forEach(o => setHighlightState(o, newState));
        }

        function setupInteraction() {
            const container = document.getElementById('canvas-container');

            const startDrag = (e) => {
                if(e.target.tagName === 'INPUT' || e.target.tagName === 'BUTTON' || e.target.tagName === 'SELECT') return;
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                // Cross-section vertical drag check
                if (showCrossSection && csMeshGlobal) {
                    mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObject(csMeshGlobal, false);
                    if (intersects.length > 0) {
                        isDraggingCS = true;
                        startMouseY = clientY;
                        startCSHeight = crossSectionRelativeHeight;
                        return; // Prevent rotating the shape while dragging CS
                    }
                }

                isDragging = true;
                previousMousePosition = { x: clientX, y: clientY };
                startClickPos = { x: clientX, y: clientY };
                startClickTime = Date.now();
            };

            const drag = (e) => {
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                // Handle 3D Dragging of the Cross Section
                if (isDraggingCS) {
                    const deltaY = clientY - startMouseY;
                    let newH = startCSHeight - (deltaY / 300); // 300px visual drag range
                    newH = Math.max(0, Math.min(1, newH));
                    crossSectionRelativeHeight = newH;
                    document.getElementById('cs-slider').value = newH;
                    if (crossSectionHinge) {
                        crossSectionHinge.position.y = (newH - 0.5) * currentHeight;
                    }
                    return;
                }

                if (!isDragging) return;
                const deltaX = clientX - previousMousePosition.x;
                const deltaY = clientY - previousMousePosition.y;
                targetRotationY += deltaX * 0.01;
                targetRotationX += deltaY * 0.01;
                previousMousePosition = { x: clientX, y: clientY };
            };

            const stopDrag = (e) => {
                if (isDraggingCS) {
                    isDraggingCS = false;
                    return; // Prevent triggering a shape click immediately after drag
                }
                if (!isDragging) return;
                isDragging = false;
                const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                
                const dx = clientX - startClickPos.x;
                const dy = clientY - startClickPos.y;
                const dist = Math.sqrt(dx*dx + dy*dy);
                const time = Date.now() - startClickTime;

                // Click detection (small movement, short time)
                if (dist < 5 && time < 300) {
                    mouse.x = (clientX / window.innerWidth) * 2 - 1;
                    mouse.y = -(clientY / window.innerHeight) * 2 + 1;
                    raycaster.setFromCamera(mouse, camera);
                    const intersects = raycaster.intersectObjects(clickableMeshes, false);
                    if (intersects.length > 0) toggleHighlight(intersects[0].object);
                }
            };

            container.addEventListener('mousedown', startDrag);
            container.addEventListener('mousemove', drag);
            window.addEventListener('mouseup', stopDrag);
            container.addEventListener('touchstart', startDrag, {passive: true});
            container.addEventListener('touchmove', drag, {passive: true});
            window.addEventListener('touchend', stopDrag);

            container.addEventListener('wheel', (e) => {
                camera.position.z += e.deltaY * 0.01;
                camera.position.z = Math.max(3, Math.min(camera.position.z, 30));
            }, {passive: true});

            // UI Listeners
            const shapeSelect = document.getElementById('shape-select');
            shapeSelect.addEventListener('change', (e) => generateShape(e.target.value));

            const themeSelect = document.getElementById('theme-select');
            themeSelect.addEventListener('change', (e) => {
                currentTheme = e.target.value;
                
                if (currentTheme === 'matrix') {
                    // Use the 2D canvas as the 3D background texture
                    scene.background = matrixTexture;
                    bloomPass.strength = 0.6;
                } else {
                    scene.background = new THREE.Color(themes[currentTheme].bg);
                    if (themes[currentTheme].glow) {
                        bloomPass.strength = currentTheme === 'neon' ? 0.4 : 0.6;
                    } else {
                        bloomPass.strength = 0;
                    }
                }
                generateShape(shapeSelect.value);
            });

            const unfoldSlider = document.getElementById('unfold-slider');
            unfoldSlider.addEventListener('input', (e) => {
                unfoldAnimActive = false;
                currentUnfoldProgress = parseFloat(e.target.value);
                updateFoldState(currentUnfoldProgress);
            });

            document.getElementById('btn-fold').addEventListener('click', () => { unfoldAnimActive = true; unfoldAnimTarget = 0; });
            document.getElementById('btn-unfold').addEventListener('click', () => { unfoldAnimActive = true; unfoldAnimTarget = 1; });

            const heightSlider = document.getElementById('height-slider');
            heightSlider.addEventListener('input', (e) => {
                heightAnimActive = false;
                document.getElementById('btn-anim-height').classList.remove('active');
                currentHeight = parseFloat(e.target.value);
                generateShape(shapeSelect.value);
            });

            const btnAnimHeight = document.getElementById('btn-anim-height');
            btnAnimHeight.addEventListener('click', () => {
                heightAnimActive = !heightAnimActive;
                btnAnimHeight.classList.toggle('active');
            });

            document.getElementById('btn-reset-view').addEventListener('click', () => isResettingView = true);

            const btnPerimeter = document.getElementById('toggle-perimeter');
            btnPerimeter.addEventListener('click', () => {
                highlightPerimeter = !highlightPerimeter;
                btnPerimeter.classList.toggle('active');
                updatePerimeterHighlight();
            });

            // UI Listeners for the Cross-Section
            const toggleCSBtn = document.getElementById('toggle-cross-section');
            toggleCSBtn.addEventListener('click', (e) => {
                showCrossSection = !showCrossSection;
                if (showCrossSection) {
                    e.target.classList.add('bg-green-500', 'text-white');
                } else {
                    e.target.classList.remove('bg-green-500', 'text-white');
                }
                document.getElementById('cs-controls').style.display = showCrossSection ? 'flex' : 'none';
                if (crossSectionHinge) crossSectionHinge.visible = showCrossSection && currentUnfoldProgress === 0;
            });

            const csSlider = document.getElementById('cs-slider');
            csSlider.addEventListener('input', (e) => {
                csAnimActive = false;
                document.getElementById('btn-anim-cs').classList.remove('active');
                crossSectionRelativeHeight = parseFloat(e.target.value);
                if (crossSectionHinge) {
                    crossSectionHinge.position.y = (crossSectionRelativeHeight - 0.5) * currentHeight;
                }
            });

            const btnAnimCS = document.getElementById('btn-anim-cs');
            if (btnAnimCS) {
                btnAnimCS.addEventListener('click', () => {
                    csAnimActive = !csAnimActive;
                    btnAnimCS.classList.toggle('active');
                });
            }
        }

        function updateFoldState(progress) {
            if (crossSectionHinge) {
                crossSectionHinge.visible = showCrossSection && progress === 0;
            }

            faces.forEach(face => {
                if (face.type === 'lateral') {
                    const currentAngle = THREE.MathUtils.lerp(face.targetFoldAngle, face.targetUnfoldAngle, progress);
                    face.mesh.rotation.y = currentAngle;
                } else if (face.type === 'base' || face.type === 'cross-section') {
                    const currentAngle = THREE.MathUtils.lerp(face.targetFoldAngle, face.targetUnfoldAngle, progress);
                    face.mesh.rotation.x = currentAngle;
                }
            });
        }

        function updatePerimeterHighlight() {
            thickEdgesGroups.forEach(group => group.visible = highlightPerimeter);
        }

        function animate() {
            requestAnimationFrame(animate);

            // Smooth Drag Rotation Lerp
            currentRotationX += (targetRotationX - currentRotationX) * 0.1;
            currentRotationY += (targetRotationY - currentRotationY) * 0.1;
            if(!isResettingView) {
                prismGroup.rotation.x = currentRotationX;
                prismGroup.rotation.y = currentRotationY;
            }

            // Unfold Animation
            if (unfoldAnimActive) {
                const step = 1.0 / 180; // ~3 seconds at 60fps
                if (currentUnfoldProgress < unfoldAnimTarget) {
                    currentUnfoldProgress = Math.min(unfoldAnimTarget, currentUnfoldProgress + step);
                } else {
                    currentUnfoldProgress = Math.max(unfoldAnimTarget, currentUnfoldProgress - step);
                }
                document.getElementById('unfold-slider').value = currentUnfoldProgress;
                updateFoldState(currentUnfoldProgress);
                if (currentUnfoldProgress === unfoldAnimTarget) unfoldAnimActive = false;
            }

            // Height Animation
            if (heightAnimActive) {
                currentHeight += heightAnimDir * 0.04;
                if (currentHeight >= 8) { currentHeight = 8; heightAnimDir = -1; } 
                else if (currentHeight <= 0) { currentHeight = 0; heightAnimDir = 1; }
                document.getElementById('height-slider').value = currentHeight;
                generateShape(document.getElementById('shape-select').value);
            }

            // Cross Section Animation
            if (csAnimActive && crossSectionHinge && showCrossSection && currentUnfoldProgress === 0) {
                crossSectionRelativeHeight += csAnimDir * 0.01;
                if (crossSectionRelativeHeight >= 1) { crossSectionRelativeHeight = 1; csAnimDir = -1; }
                else if (crossSectionRelativeHeight <= 0) { crossSectionRelativeHeight = 0; csAnimDir = 1; }
                document.getElementById('cs-slider').value = crossSectionRelativeHeight;
                crossSectionHinge.position.y = (crossSectionRelativeHeight - 0.5) * currentHeight;
            }

            // Reset View Animation
            if (isResettingView) {
                targetRotationX = 0.5; targetRotationY = 0.5;
                prismGroup.rotation.x = THREE.MathUtils.lerp(prismGroup.rotation.x, 0.5, 0.05);
                prismGroup.rotation.y = THREE.MathUtils.lerp(prismGroup.rotation.y, 0.5, 0.05);
                camera.position.z = THREE.MathUtils.lerp(camera.position.z, 12, 0.05);
                
                if (Math.abs(prismGroup.rotation.x - 0.5) < 0.01 && Math.abs(camera.position.z - 12) < 0.01) {
                    isResettingView = false;
                }
            }

            // Neon Pulsating Effect
            if (currentTheme === 'neon') {
                const time = Date.now() * 0.003;
                bloomPass.strength = 0.4 + Math.sin(time) * 0.15; // Pulsate intensity
            }

            // Matrix BG Update
            drawMatrix();

            // Render
            if (themes[currentTheme].glow) {
                composer.render();
            } else {
                renderer.render(scene, camera);
            }
        }

        // Kickoff
        window.onload = initThreeJS;
    </script>
</body>
</html>
